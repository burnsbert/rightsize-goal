name: Codex checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s codex/tests -p "test_*.py"
      - run: python codex/install.py --help
      - name: Shell wrapper
        if: runner.os != 'Windows'
        run: sh codex/install.sh --help
      - name: PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./codex/install.ps1 -?
