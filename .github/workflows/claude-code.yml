name: Claude Code checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s claude-code/tests -p "test_*.py"
      - run: python claude-code/install.py --help
      - name: Shell wrapper
        if: runner.os != 'Windows'
        run: sh claude-code/install.sh --help
      - name: PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./claude-code/install.ps1 -?

  plugin-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict claude-code/
